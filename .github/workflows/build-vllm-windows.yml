name: Build vLLM wheel (Windows)

on:
  workflow_dispatch:
    inputs:
      vllm_version:
        description: vLLM Windows version to build
        required: false
        default: 0.10.1.1

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            cuda_short: '12.6'
            cuda_installer_url: 'https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_561.17_windows.exe'
            torch_version: '2.7.1+cu126'
            torchaudio_version: '2.7.1+cu126'
            torchvision_version: '0.22.1+cu126'
            torch_index_url: 'https://download.pytorch.org/whl/cu126'
            artifact_suffix: 'cu126'
          - python-version: '3.12'
            cuda_short: '12.6'
            cuda_installer_url: 'https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_561.17_windows.exe'
            torch_version: '2.7.1+cu126'
            torchaudio_version: '2.7.1+cu126'
            torchvision_version: '0.22.1+cu126'
            torch_index_url: 'https://download.pytorch.org/whl/cu126'
            artifact_suffix: 'cu126'
          - python-version: '3.11'
            cuda_short: '12.4'
            cuda_installer_url: 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
            torch_version: '2.5.1+cu124'
            torchaudio_version: '2.5.1+cu124'
            torchvision_version: '0.20.1+cu124'
            torch_index_url: 'https://download.pytorch.org/whl/cu124'
            artifact_suffix: 'cu124'
          - python-version: '3.12'
            cuda_short: '12.4'
            cuda_installer_url: 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
            torch_version: '2.5.1+cu124'
            torchaudio_version: '2.5.1+cu124'
            torchvision_version: '0.20.1+cu124'
            torch_index_url: 'https://download.pytorch.org/whl/cu124'
            artifact_suffix: 'cu124'
    env:
      PYTHONUTF8: '1'
      VLLM_VERSION: ${{ github.event.inputs.vllm_version || '0.10.1.1' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Clone vLLM Windows fork
        shell: pwsh
        run: |
          git clone --depth 1 --branch "v${{ env.VLLM_VERSION }}" https://github.com/penfever/vllm-windows.git
          if (-not (Test-Path 'vllm-windows')) {
            Write-Error "Failed to clone vllm-windows at v${{ env.VLLM_VERSION }}"
            exit 1
          }
          Set-Location vllm-windows
          git fetch --tags origin "refs/tags/v${{ env.VLLM_VERSION }}"
          git fetch --unshallow 2>$null || Write-Host "Repository already full-depth"
          git describe --tags --always
          Set-Location ..

      - name: Install CUDA toolkit ${{ matrix.cuda_short }}
        shell: pwsh
        run: |
          $installerUrl = '${{ matrix.cuda_installer_url }}'
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_installer.exe'
          Write-Host "Downloading CUDA toolkit from $installerUrl"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Write-Host "Installing CUDA toolkit silently"
          Start-Process -FilePath $installerPath -ArgumentList '-s' -Wait
          $cudaPath = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cudaPath) {
            throw 'CUDA toolkit install failed; CUDA path not found.'
          }
          $cudaRoot = $cudaPath.FullName
          $cudaBin = Join-Path $cudaRoot 'bin'
          $cudaLibNvvp = Join-Path $cudaRoot 'libnvvp'
          Write-Host "Using CUDA toolkit path: $cudaRoot"
          echo "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CudaToolkitDir=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_PATH_V12_0=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PATH=$cudaBin;$cudaLibNvvp;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$cudaBin\nvcc.exe" --version

      - name: Prepare build environment
        shell: pwsh
        working-directory: vllm-windows
        run: |
          python -m pip install --upgrade pip
          pip install wheel ninja packaging setuptools
          pip install setuptools-scm

      - name: Enable long paths for git
        shell: pwsh
        run: |
          git config --global core.longpaths true

      - name: Install PyTorch (${{ matrix.torch_version }})
        shell: pwsh
        working-directory: vllm-windows
        run: |
          if ('${{ matrix.torch_version }}'.EndsWith('cu126')) {
            $url = 'https://download.pytorch.org/whl/cu126'
          } elseif ('${{ matrix.torch_version }}'.EndsWith('cu124')) {
            $url = 'https://download.pytorch.org/whl/cu124'
          } else {
            $url = 'https://download.pytorch.org/whl/cu126'
          }
          pip install torch==${{ matrix.torch_version }} torchaudio==${{ matrix.torchaudio_version }} torchvision==${{ matrix.torchvision_version }} --index-url $url

      - name: Install build requirements
        shell: pwsh
        working-directory: vllm-windows
        run: |
          pip install -r requirements/build.txt
          pip install -r requirements/windows.txt

      - name: Build vLLM wheel
        shell: cmd
        working-directory: vllm-windows
        run: |
          call "%ProgramFiles%\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set DISTUTILS_USE_SDK=1
          set VLLM_TARGET_DEVICE=cuda
          set VLLM_FORCE_TARGET_DEVICE=cuda
          set SETUPTOOLS_SCM_PRETEND_VERSION=${{ env.VLLM_VERSION }}
          set MAX_JOBS=8
          set CUDA_ROOT=%CUDA_PATH%
          set CUDA_HOME=%CUDA_PATH%
          set CMAKE_ARGS=-DCMAKE_CUDA_ARCHITECTURES=80;86;89;90
          pip wheel . --no-deps --no-build-isolation -w dist

      - name: List wheel artifacts
        shell: pwsh
        working-directory: vllm-windows
        run: |
          Get-ChildItem dist

      - name: Upload vLLM wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vllm-windows-wheel-cuda${{ matrix.cuda_short }}-py${{ matrix.python-version }}-${{ matrix.artifact_suffix }}
          path: vllm-windows/dist/*.whl
          if-no-files-found: error
