name: Build llama.cpp wheel (Windows)

on:
  workflow_dispatch:
    inputs:
      llama_cpp_version:
        description: llama-cpp-python version to build
        required: false
        default: 0.3.15
      python_version:
        description: Python version (major.minor) for the wheel
        required: false
        default: '3.12'

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip and install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "cmake>=3.26" ninja scikit-build-core pip wheel

      - name: Build llama-cpp wheel
        shell: pwsh
        env:
          LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version }}
        run: |
          $version = if ($env:LLAMA_CPP_VERSION) { $env:LLAMA_CPP_VERSION } else { '0.3.15' }
          Write-Host "Building llama-cpp-python version $version for Python ${{ matrix.python-version }}"

          mkdir dist | Out-Null
          $env:CMAKE_ARGS = '-DGGML_BLAS=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF'
          pip wheel --no-deps "llama-cpp-python==$version" --wheel-dir dist

      - name: List build artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-win-wheel-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

  build-cuda:
    runs-on: windows-2022
    strategy:
      matrix:
        include:
          - python-version: '3.11'
            cuda-short: '12.4'
            cuda-redistrib-version: '12.4.127'
            cublas-version: '12.4.5.8'
            cuda-installer-url: 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          - python-version: '3.12'
            cuda-short: '12.4'
            cuda-redistrib-version: '12.4.127'
            cublas-version: '12.4.5.8'
            cuda-installer-url: 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          - python-version: '3.13'
            cuda-short: '12.4'
            cuda-redistrib-version: '12.4.127'
            cublas-version: '12.4.5.8'
            cuda-installer-url: 'https://developer.download.nvidia.com/compute/cuda/12.4.1/local_installers/cuda_12.4.1_551.78_windows.exe'
          - python-version: '3.11'
            cuda-short: '12.6'
            cuda-redistrib-version: '12.6.77'
            cublas-version: '12.6.4.1'
            cuda-installer-url: 'https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_561.17_windows.exe'
          - python-version: '3.12'
            cuda-short: '12.6'
            cuda-redistrib-version: '12.6.77'
            cublas-version: '12.6.4.1'
            cuda-installer-url: 'https://developer.download.nvidia.com/compute/cuda/12.6.3/local_installers/cuda_12.6.3_561.17_windows.exe'
    env:
      PYTHONUTF8: '1'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA toolkit ${{ matrix.cuda-short }}
        shell: pwsh
        run: |
          $installerUrl = '${{ matrix.cuda-installer-url }}'
          $installerPath = Join-Path $env:RUNNER_TEMP 'cuda_installer.exe'
          Write-Host "Downloading CUDA toolkit from $installerUrl"
          Invoke-WebRequest -Uri $installerUrl -OutFile $installerPath
          Write-Host "Installing CUDA toolkit silently"

          Start-Process -FilePath $installerPath -ArgumentList '-s' -Wait
          $cudaPath = Get-ChildItem 'C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA' | Sort-Object Name -Descending | Select-Object -First 1
          if (-not $cudaPath) {
            throw 'CUDA toolkit install failed; CUDA path not found.'
          }

          $cudaRoot = $cudaPath.FullName
          $cudaBin = Join-Path $cudaRoot 'bin'
          $cudaLibNvvp = Join-Path $cudaRoot 'libnvvp'

          Write-Host "Using CUDA toolkit path: $cudaRoot"
          echo "CUDA_PATH=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CudaToolkitDir=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "CUDA_PATH_V12_0=$cudaRoot" | Out-File -FilePath $env:GITHUB_ENV -Append
          echo "PATH=$cudaBin;$cudaLibNvvp;$env:PATH" | Out-File -FilePath $env:GITHUB_ENV -Append

          Write-Host 'nvcc version:'
          & "$($cudaPath.FullName)\bin\nvcc.exe" --version

      - name: Upgrade pip and install build tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade "cmake>=3.26" ninja scikit-build-core pip wheel

      - name: Build CUDA-enabled llama-cpp wheel
        shell: pwsh
        env:
          LLAMA_CPP_VERSION: ${{ inputs.llama_cpp_version }}
        run: |
          $version = if ($env:LLAMA_CPP_VERSION) { $env:LLAMA_CPP_VERSION } else { '0.3.15' }
          Write-Host "Building CUDA-enabled llama-cpp-python version $version for Python ${{ matrix.python-version }} (CUDA ${{ matrix.cuda-short }})"

          mkdir dist | Out-Null
          $env:CMAKE_ARGS = '-DGGML_CUDA=ON -DGGML_BLAS=OFF -DGGML_METAL=OFF'
          pip wheel --no-deps "llama-cpp-python==$version" --wheel-dir dist

      - name: Stage CUDA redistributable DLLs
        shell: pwsh
        run: |
          $root = Join-Path (Get-Location) "cuda_v${{ matrix.cuda-short }}"
          New-Item -ItemType Directory -Path $root -Force | Out-Null
          $downloads = Join-Path $root 'downloads'
          New-Item -ItemType Directory -Path $downloads -Force | Out-Null

          $cudartUrl = "https://developer.download.nvidia.com/compute/cuda/redist/cuda_cudart/windows-x86_64/cuda_cudart-windows-x86_64-${{ matrix.cuda-redistrib-version }}-archive.zip"
          $cublasUrl = "https://developer.download.nvidia.com/compute/cuda/redist/libcublas/windows-x86_64/libcublas-windows-x86_64-${{ matrix.cublas-version }}-archive.zip"

          $archives = @(
            @{ Name = 'cudart.zip'; Url = $cudartUrl },
            @{ Name = 'cublas.zip'; Url = $cublasUrl }
          )

          foreach ($archive in $archives) {
            $zipPath = Join-Path $downloads $archive.Name
            Write-Host "Downloading $($archive.Url)"
            Invoke-WebRequest -Uri $archive.Url -OutFile $zipPath
            Expand-Archive -Path $zipPath -DestinationPath $downloads -Force
          }

          $dllTarget = Join-Path $root 'bin'
          New-Item -ItemType Directory -Path $dllTarget -Force | Out-Null
          Get-ChildItem -Path $downloads -Recurse -Filter *.dll | ForEach-Object {
            Copy-Item $_.FullName -Destination $dllTarget -Force
          }

          $licenses = Join-Path $root 'licenses'
          New-Item -ItemType Directory -Path $licenses -Force | Out-Null
          Get-ChildItem -Path $downloads -Recurse -Filter *.txt | ForEach-Object {
            Copy-Item $_.FullName -Destination $licenses -Force
          }

          $zipPath = Join-Path (Get-Location) "cuda_v${{ matrix.cuda-short }}.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path @($dllTarget, $licenses) -DestinationPath $zipPath -Force

      - name: List build artifacts
        shell: pwsh
        run: |
          Get-ChildItem dist

      - name: Upload CUDA wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-win-wheel-cuda${{ matrix.cuda-short }}-py${{ matrix.python-version }}
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload CUDA runtime bundle
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: cuda-runtime-v${{ matrix.cuda-short }}
          path: cuda_v${{ matrix.cuda-short }}.zip
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: '1'
      LLAMA_CPP_VERSION: '0.3.16'
      PYTHON_VERSION: '3.12'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade scikit-build-core cmake ninja wheel

      - name: Build CPU llama-cpp wheel (Linux)
        env:
          CMAKE_ARGS: '-DGGML_CUBLAS=OFF -DGGML_CUDA=OFF -DGGML_METAL=OFF'
        run: |
          mkdir -p dist
          echo "Building llama-cpp-python $LLAMA_CPP_VERSION for Python $PYTHON_VERSION (CPU)"
          pip wheel --no-deps "llama-cpp-python==$LLAMA_CPP_VERSION" --wheel-dir dist

      - name: List build artifacts
        run: ls -al dist

      - name: Upload Linux CPU wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-linux-wheel-cpu-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl
          if-no-files-found: error

  build-linux-cuda:
    runs-on: ubuntu-22.04
    env:
      PYTHONUTF8: '1'
      LLAMA_CPP_VERSION: '0.3.16'
      PYTHON_VERSION: '3.12'
      CUDA_VERSION: '12.6.3'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install CUDA ${{ env.CUDA_VERSION }}
        uses: Jimver/cuda-toolkit@v0.2.15
        with:
          cuda: ${{ env.CUDA_VERSION }}
          method: network

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build patchelf

      - name: Upgrade pip and install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade scikit-build-core cmake ninja wheel

      - name: Build CUDA 12.6 llama-cpp wheel (Linux)
        env:
          CMAKE_ARGS: '-DGGML_CUBLAS=ON -DGGML_CUDA=ON -DGGML_METAL=OFF'
          FORCE_CMAKE: '1'
        run: |
          mkdir -p dist
          echo "Building llama-cpp-python $LLAMA_CPP_VERSION for Python $PYTHON_VERSION (CUDA 12.6)"
          echo "CUDA root: ${{ env.CUDA_PATH || '/usr/local/cuda' }}"
          pip wheel --no-deps "llama-cpp-python==$LLAMA_CPP_VERSION" --wheel-dir dist

      - name: List build artifacts
        run: ls -al dist

      - name: Upload Linux CUDA wheel
        uses: actions/upload-artifact@v4
        with:
          name: llama-cpp-python-linux-wheel-cuda126-py${{ env.PYTHON_VERSION }}
          path: dist/*.whl
          if-no-files-found: error
