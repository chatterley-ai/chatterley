# LlamaCPP Inference config for DeepSeek-V3.2-Exp GGUF (macOS compatible).
#
# Requirements:
#   - Run `pip install oumi[llama_cpp]`
#
# Usage:
#   # 1. Download the GGUF file to current working directory:
#   hf download unsloth/DeepSeek-V3.2-Exp-GGUF \
#     DeepSeek-V3.2-Exp-Q4_K_M.gguf --local-dir .
#
#   # 2. Run inference:
#   oumi infer -i -c configs/recipes/deepseek_r1/inference/v3_2_exp_gguf_macos_infer.yaml
#
# See Also:
#   - Documentation: https://oumi.ai/docs/en/latest/user_guides/infer/infer.html
#   - Config class: oumi.core.configs.InferenceConfig
#   - Config source: https://github.com/oumi-ai/oumi/blob/main/src/oumi/core/configs/inference_config.py
#   - Other inference configs: configs/**/inference/

model:
  model_name: "unsloth/DeepSeek-V3.2-Exp-GGUF"
  tokenizer_name: "deepseek-ai/DeepSeek-V3.2-Exp"
  model_max_length: 131072
  torch_dtype_str: "float16"
  trust_remote_code: True
  model_kwargs:
    filename: "DeepSeek-V3.2-Exp-Q4_K_M.gguf"

generation:
  max_new_tokens: 2048
  temperature: 0.7
  top_p: 0.9

engine: LLAMACPP