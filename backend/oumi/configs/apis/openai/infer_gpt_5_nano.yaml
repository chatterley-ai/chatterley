# OpenAI Inference config for GPT-5-nano.
#
# Requirements:
#   - Set environment variable: export OPENAI_API_KEY=your_key_here
#
# Usage:
#   oumi infer -i -c configs/apis/openai/infer_gpt_5_nano.yaml
#
# See Also:
#   - Documentation: https://oumi.ai/docs/en/latest/user_guides/infer/infer.html
#   - Config class: oumi.core.configs.InferenceConfig
#   - Config source: https://github.com/oumi-ai/oumi/blob/main/src/oumi/core/configs/inference_config.py
#   - Other inference configs: configs/**/inference/

model:
  model_name: "gpt-5-nano"
  model_max_length: 32768
  is_vision_capable: false
  is_omni_capable: false

engine: OPENAI

generation:
  temperature: 1.0
